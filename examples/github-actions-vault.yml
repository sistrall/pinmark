name: pinmark sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: pinmark-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinmark
        run: npm install -g pinmark

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # Use the playwright-core bundled with pinmark so the Chromium revision matches
      # the one pinmark launches.
      - name: Install Chromium
        run: node "$(npm root -g)/pinmark/node_modules/playwright-core/cli.js" install chromium --with-deps

      - name: Run pinmark sync
        env:
          PINBOARD_API_TOKEN: ${{ secrets.PINBOARD_API_TOKEN }}
        # Keep a hard bound below the job timeout so the commit step still runs and
        # saves whatever was synced if something unexpected stalls.
        run: timeout --kill-after=30s 20m pinmark sync

      - name: Commit and push changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
